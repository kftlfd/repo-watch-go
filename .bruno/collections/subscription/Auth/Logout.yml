info:
  name: Logout
  type: http
  seq: 16

http:
  method: POST
  url: "{{URL}}/api/auth/logout"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("accessToken", "");
        bru.setVar("refreshToken", "");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
