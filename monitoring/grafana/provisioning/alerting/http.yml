apiVersion: 1
groups:
  - orgId: 1
    name: repo-watch-http
    folder: repo-watch-go
    interval: 1m
    rules:
      - uid: rg4zhttp5xx
        title: HTTP 5xx error rate is high
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: |
                (
                  sum by (job) (rate(http_requests_total{status=~"5.."}[5m]))
                  /
                  clamp_min(sum by (job) (rate(http_requests_total[5m])), 1)
                )
                and on(job) (sum by (job) (rate(http_requests_total[5m])) > 0.1)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.05
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          description: The public API or web UI is returning server errors. Check application logs, database health, and dependency availability
          summary: More than 5% of subscription HTTP requests are failing with 5xx
        labels:
          severity: warning
        isPaused: false
        notification_settings:
          receiver: empty
