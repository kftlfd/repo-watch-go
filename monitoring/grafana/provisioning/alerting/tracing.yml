apiVersion: 1
groups:
  - orgId: 1
    name: repo-watch-tracing
    folder: repo-watch-go
    interval: 1m
    rules:
      - uid: tr4zjaegerdown
        title: Jaeger tracing backend is unavailable
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: absent(up{job="jaeger"}) or (min(up{job="jaeger"}) < bool 1)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 1m
        annotations:
          description: Traces cannot be exported or queried until Jaeger is reachable again
          summary: Jaeger is not being scraped or is down
        labels:
          severity: critical
        isPaused: false
        notification_settings:
          receiver: empty
      - uid: tr4zdropspans
        title: Jaeger is dropping spans
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: sum(increase(jaeger_collector_spans_dropped_total[5m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          description: The collector queue or storage is saturated. Reduce sampling or raise Jaeger resources.
          summary: Jaeger discarded spans
        labels:
          severity: critical
        isPaused: false
        notification_settings:
          receiver: empty
