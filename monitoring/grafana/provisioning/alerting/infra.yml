apiVersion: 1
groups:
  - orgId: 1
    name: repo-watch-infra
    folder: repo-watch-go
    interval: 1m
    rules:
      - uid: eg4zlf4b529z4c
        title: RabbitMQ connection is down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: min(rabbitmq_connected)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 1m
        annotations:
          description: Publishers and consumers may be unable to deliver or receive events
          summary: A service has lost its RabbitMQ connection
        labels:
          severity: critical
        isPaused: false
        notification_settings:
          receiver: empty
      - uid: ag4zlv37hro5cb
        title: RabbitMQ exporter is unavailable
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: absent(up{job="repo-watch-rabbitmq"}) or (min(up{job="repo-watch-rabbitmq"}) < bool 1)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 1m
        annotations:
          summary: RabbitMQ Prometheus exporter is not being scraped
        labels:
          severity: critical
        isPaused: false
