services:
  prometheus:
    image: prom/prometheus:v3.15.1
    ports:
      - 9090:9090
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - host.docker.internal:host-gateway

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      MEMORY_MAX_TRACES: "100000" # Bound the in-memory store
    ports:
      - "16686:16686" # UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "14269:14269" # admin and Prometheus metrics

  grafana:
    image: grafana/grafana:13.2-slim
    ports:
      - 3050:3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/dashboards
      - ./grafana/provisioning:/etc/grafana/provisioning

volumes:
  prometheus-data:
    name: rw-go_prometheus
  grafana-data:
    name: rw-go_grafana
