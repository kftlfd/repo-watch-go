x-app: &app
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  extra_hosts:
    - "host.docker.internal:host-gateway"
  env_file:
    - .env
  environment: &env
    PORT_ADMIN: 4000
    DB_URL: postgres://postgres:postgres@postgres:5432?sslmode=disable
    RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    DB_AUTO_CREATE: false
    DB_AUTO_MIGRATE: false
  healthcheck:
    test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4000/ready || exit 1" ]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 15s

x-migrate: &migrate
  command: [ "migrate" ]
  restart: no
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    <<: *env
    DB_AUTO_CREATE: true
    DB_AUTO_MIGRATE: true
  healthcheck:
    disable: true

x-subscription: &subscription
  <<: *app
  image: kftlfd/repo-watch-go-subscription
  build:
    context: .
    args:
      SERVICE: subscription

x-scanner: &scanner
  <<: *app
  image: kftlfd/repo-watch-go-scanner
  build:
    context: .
    args:
      SERVICE: scanner

x-notification: &notification
  <<: *app
  image: kftlfd/repo-watch-go-notification
  build:
    context: .
    args:
      SERVICE: notification

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    ports:
      - "5672:5672" # amqp091
      - "15672:15672" # management
      - "15692:15692" # Prometheus exporter
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  subscription-migrate:
    <<: [ *migrate, *subscription ]

  subscription:
    <<: *subscription
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      subscription-migrate:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
      - "4010:4000"

  scanner-migrate:
    <<: [ *migrate, *scanner ]

  scanner:
    <<: *scanner
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      scanner-migrate:
        condition: service_completed_successfully
    ports:
      - "4020:4000"

  notification-migrate:
    <<: [ *migrate, *notification ]

  notification:
    <<: *notification
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      notification-migrate:
        condition: service_completed_successfully
    ports:
      - "4030:4000"

  mailer:
    <<: *app
    image: kftlfd/repo-watch-go-mailer
    build:
      context: .
      args:
        SERVICE: mailer
    ports:
      - "4040:4000"

volumes:
  postgres-data:
    name: rw-go_postgres
  rabbitmq-data:
    name: rw-go_rabbitmq
