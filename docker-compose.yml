x-app: &app
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  environment:
    PORT_ADMIN: 4000
    POSTGRES_URL: postgres://postgres:postgres@postgres:5432
    RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    GH_API_URL: ${GH_API_URL:-https://api.github.com}
    GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4000/ready || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 15s

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
      - "61613:61613"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  subscription:
    <<: *app
    image: kftlfd/repo-watch-go-subscription
    build:
      context: .
      args:
        SERVICE: subscription
    ports:
      - "3000:3000"
      - "4010:4000"
    
  scanner:
    <<: *app
    image: kftlfd/repo-watch-go-scanner
    build:
      context: .
      args:
        SERVICE: scanner
    ports:
      - "4020:4000"

  notification:
    <<: *app
    image: kftlfd/repo-watch-go-notification
    build:
      context: .
      args:
        SERVICE: notification
    ports:
      - "4030:4000"

  mailer:
    <<: *app
    image: kftlfd/repo-watch-go-mailer
    build:
      context: .
      args:
        SERVICE: mailer
    ports:
      - "4040:4000"

volumes:
  postgres-data:
  rabbitmq-data:
