x-app: &app
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  environment:
    POSTGRES_URL: postgres://postgres:postgres@postgres:5432
    RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    GH_API_URL: ${GH_API_URL:-https://api.github.com}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
      - "61613:61613"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  subscription:
    <<: *app
    build:
      context: .
      args:
        SERVICE: subscription
    ports:
      - "9010:9010"
      - "9011:9011"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9011/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  scanner:
    <<: *app
    build:
      context: .
      args:
        SERVICE: scanner
    ports:
      - "9021:9021"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9021/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  notification:
    <<: *app
    build:
      context: .
      args:
        SERVICE: notification
    ports:
      - "9031:9031"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9031/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  mailer:
    <<: *app
    build:
      context: .
      args:
        SERVICE: mailer

volumes:
  postgres-data:
  rabbitmq-data:
